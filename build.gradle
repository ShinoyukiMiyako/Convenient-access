plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    // 把第三方依赖打进 mod jar (ForgeGradle 的 implementation 不会嵌入运行期 classpath)
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

version = mod_version
group = mod_group_id

// sqlite-jdbc 不能和别的 mod 共存于 shade: 它按包路径加载 org/sqlite/native/** 原生库, 不可 relocate,
// 于是 fat jar 会把 org.sqlite.* 直接导出到本模块。一旦另一个 mod (miningdim / cairn) 用 jarJar 把同一个
// 库作为独立模块嵌入, JPMS 就会因两个模块导出同一个包而拒绝启动
// (ResolutionException: Modules org.xerial.sqlitejdbc and shinoyuki_accesshub export package org.sqlite.date)。
// 故改走 jarJar: 由 Forge 在模块层按版本范围仲裁出唯一实例, 多 mod 内嵌同库时自动去重。
// enable() 必须先于 jarJar 依赖声明调用, 否则配置不生效。
jarJar.enable()

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {}
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all',
                 '--output', file('src/generated/resources/'),
                 '--existing', file('src/main/resources/')
        }
    }
}

// v2 迁移期间，旧 Bukkit 代码暂留作为复用层参考，但不进编译路径
// 后续 commit 会按子模块逐步迁到 com.shinoyuki.accesshub.*，全部搬完后移除此 exclude
sourceSets.main.java {
    exclude 'com/xaoxiao/**'
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    // Spark API (性能监测, 软依赖, 由服务器安装的 spark mod 在运行期提供)
    maven {
        name = 'lucko'
        url = 'https://repo.lucko.me/'
        content { includeGroup 'me.lucko' }
    }
}

configurations {
    // shade 里的依赖会被 shadowJar 打进最终 jar; extendsFrom 让它们同时进编译 classpath
    shade
    implementation.extendsFrom shade
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // HTTP 服务器栈 (后台管理 API 入口) — 必须 shade 进 jar, Forge 运行期不提供
    shade 'org.eclipse.jetty:jetty-server:11.0.20'
    shade 'org.eclipse.jetty:jetty-servlet:11.0.20'
    shade 'jakarta.servlet:jakarta.servlet-api:5.0.0'

    // 持久化 (SQLite 单文件) — 走 jarJar 而非 shade, 理由见文件头 jarJar.enable() 处的说明。
    //   - implementation: 编译期可见 + 传递到 testRuntime (测试直连 SQLite, 不经打包产物)。
    //     它不会被 shadowJar 打包 —— shadowJar 只取 configurations.shade。
    //   - jarJar: 内嵌进 META-INF/jarjar, 运行期由 FML 的 JarJar 机制作为独立模块加载。
    //     版本范围上界取下一个大版本(4.0)而非小版本: 范围写窄了, 别的 mod 内嵌更新的 sqlite-jdbc 时
    //     两个范围不相交, Forge 模块层会直接判定依赖冲突拒绝启动。
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
    jarJar(group: 'org.xerial', name: 'sqlite-jdbc', version: '[3.45.3.0,4.0)') {
        jarJar.pin(it, '3.46.1.3')
    }

    // 密码哈希 (玩家离线认证) — 纯 Java bcrypt, 必须 shade 进 jar, Forge 运行期不提供。
    // 传递依赖 at.favre.lib:bytes 会一并被 shade。两者均含 module-info.class,
    // 由下方 shadowJar 既有的 module-info exclude 覆盖, 无需新增 exclude。
    shade 'at.favre.lib:bcrypt:0.10.2'

    // Night Config: Forge 1.20.1 自带 3.6.4 (传递依赖), 运行期已在 classpath。
    // 用 compileOnly 显式声明编译期可见, 不打包 (避免与 Forge 版本冲突)。
    compileOnly 'com.electronwill.night-config:core:3.6.4'
    compileOnly 'com.electronwill.night-config:toml:3.6.4'

    // Spark API (软依赖): 仅编译期可见, 不打包。运行期由服务器安装的 spark mod 提供;
    // 未安装时 SparkIntegration 经 ModList.isLoaded 检测后降级为 JVM MXBean fallback。
    compileOnly 'me.lucko:spark-api:0.1-SNAPSHOT'

    // DPAPI (免密设备私钥保护): MC 1.20.1 客户端运行期自带 JNA 5.12.1 (随 OSHI, jnidispatch
    // 已在游戏启动时加载)。仅编译期解析 Crypt32Util 符号, 不打包, 不进 shade -> 不重蹈 sqlite
    // 原生库/版本冲突的坑。DPAPI 调用全部收敛在仅客户端 dist 加载的类, 专用服务器永不触达。
    compileOnly 'net.java.dev.jna:jna:5.12.1'
    compileOnly 'net.java.dev.jna:jna-platform:5.12.1'

    // Forge 1.20.1 自带 Gson 与 SLF4J，无需声明

    // 测试 (仅测试期, 不打包)。被测类为纯 Java (认证/DB), 不依赖 MC 运行期。
    // sqlite-jdbc / bcrypt 经 shade->implementation 传递到 testRuntime, 无需再声明。
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    // DPAPI 往返实测 (仅 Windows 跑, 非 Windows assumeTrue 跳过). 测试 JVM 非 Forge 环境,
    // 需自带 JNA 才能加载 jnidispatch; 故这里显式 testImplementation (与 main 的 compileOnly 区分)。
    testImplementation 'net.java.dev.jna:jna-platform:5.12.1'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    // expand 默认按平台编码读写, 中文 Windows(GBK)下会把 mods.toml 里的中文注释
    // 打成 '?' 字节, 导致 Forge 解析 mods.toml 抛 MalformedInputException 起不来服
    filteringCharset = 'UTF-8'

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    // 原始 dev jar (Mojmap, 不含依赖), 不作为发布产物
    archiveClassifier = 'dev'
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Version'   : '1',
                'Specification-Vendor'    : mod_authors,
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// fat jar: 合并 shade 依赖 + mod 类。它是【中间件】而非对外产物 ——
// sqlite 必须以嵌套 jar 的形态存在 (独立 JPMS 模块), 而 shadow 的既定行为是把遇到的 jar 一律展开合并,
// 无法在同一个任务里既 relocate Jetty 又保住嵌套结构。故由下方 jarJar 任务基于本产物再封一层。
tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar).configure {
    archiveClassifier = 'shaded'
    configurations = [project.configurations.shade]

    // 只 relocate Jetty: 自包含、避免与其它 mod 的 HTTP 栈冲突。
    // 不 relocate org.sqlite: sqlite-jdbc 按包路径加载 org/sqlite/native/** 原生库, relocate 会破坏。
    // 不 relocate jakarta.servlet: 无其它 provider, 无冲突风险。
    relocate 'org.eclipse.jetty', 'com.shinoyuki.accesshub.libs.jetty'
    // relocate bcrypt + 其传递依赖 bytes: 避免与其它 mod 各自 shade 的同库版本在
    // 同一类加载器下重复导出包冲突。bcrypt 不按包路径加载原生资源, relocate 安全。
    relocate 'at.favre.lib.crypto', 'com.shinoyuki.accesshub.libs.favre.crypto'
    relocate 'at.favre.lib.bytes', 'com.shinoyuki.accesshub.libs.favre.bytes'

    // 合并 META-INF/services (Jetty 的 ServiceLoader 文件), 否则被覆盖丢失。
    // sqlite 的 java.sql.Driver 服务文件随其嵌套 jar 走 jarJar, 不经这里。
    mergeServiceFiles()
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    // 剔除 Forge 已自带的 slf4j (Jetty 传递依赖带入): 否则 fat jar 与 Forge 的 org.slf4j 模块
    // 重复导出同名包, 触发 JPMS ResolutionException 致服务器无法启动。
    // 注: 仅从输出 jar 剔除 (文件级 exclude), slf4j 仍在编译 classpath (Forge 提供), 不影响编译。
    exclude 'org/slf4j/**'
    // 剔除 jetty-http 捆绑的 javax/servlet 遗留 XML schema 资源 (.xsd/.dtd, 无 .class):
    // 纯编程式用 jetty 不需要, 避免 Forge SecureJar 对资源目录的潜在边界问题 + 去 bloat。
    exclude 'javax/servlet/**'
    // 剔除被 shade 库带入的 module-info (JPMS 在 Forge 模块层下会冲突, 且对 fat jar 无意义)
    exclude 'module-info.class'
    exclude 'META-INF/versions/*/module-info.class'

    manifest.inheritFrom tasks.jar.manifest
}

// 关键: 对 shadowJar 产物执行 reobf (Mojmap -> SRG), 否则生产环境 MC API 调用映射错乱。
// 第三方依赖类无 MC 引用, reobf 原样放行。生成 reobfShadowJar 任务。
reobf {
    shadowJar {}
}

// 对外产物: 取已 reobf 的 shadow 中间件内容, 再由 jarJar 追加 META-INF/jarjar 下的嵌套 sqlite。
// 这样单一 jar 同时具备 relocate 后的 Jetty 与作为独立模块加载的 sqlite。
// 内容全部来自已 reobf 的中间件, 故本任务产物无需再 reobf。
tasks.named('jarJar').configure {
    archiveClassifier = ''
    dependsOn tasks.named('reobfShadowJar')
    from(zipTree(tasks.shadowJar.archiveFile))
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('assemble').configure {
    dependsOn tasks.named('jarJar')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact tasks.shadowJar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
